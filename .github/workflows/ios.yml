name: Build iOS app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'scripts/build-unsigned-ipa.sh'
      - 'scripts/preview-ios-ui.py'
      - 'tests/MicroLayoutProbe.swift'
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'scripts/build-unsigned-ipa.sh'
      - 'scripts/preview-ios-ui.py'
      - 'tests/MicroLayoutProbe.swift'
  workflow_dispatch:
    inputs:
      capture_previews:
        description: 'Build offline SwiftUI previews in an isolated simulator'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Check Micro button preferences
        run: |
          mkdir -p build
          swiftc ios/Sources/MicroLayout.swift tests/MicroLayoutProbe.swift -o build/micro-layout-probe
          build/micro-layout-probe

      - name: Build unsigned IPA
        run: |
          mkdir -p build
          sh scripts/build-unsigned-ipa.sh 2>&1 | tee build/ios-build.log
          (cd dist && shasum -a 256 -c AgentMux-unsigned.ipa.sha256)

      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v6
        with:
          name: AgentMux-unsigned-${{ github.run_number }}
          path: |
            dist/AgentMux-unsigned.ipa
            dist/AgentMux-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-log-${{ github.run_number }}
          path: build/ios-build.log
          if-no-files-found: ignore
          retention-days: 14

  previews:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_previews
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Capture actual SwiftUI states with offline data
        run: |
          for screen in text micro glide keyboard; do
            python3 scripts/preview-ios-ui.py --screen "$screen" --output "build/previews/$screen.png"
          done
          python3 scripts/preview-ios-ui.py --screen text --light --output build/previews/light.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: AgentMux-workbench-previews
          path: build/previews/*.png
          if-no-files-found: warn
