name: Terminal transport checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.*', 'scripts/test-terminal*.py', '.github/workflows/terminal.yml']
  pull_request:
    paths: ['src/**', 'Cargo.*', 'scripts/test-terminal*.py', '.github/workflows/terminal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test tools
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            command -v tmux || brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 scripts/test-terminal-api.py
      - run: python3 scripts/test-terminal-stream.py
