[package]
name = "agentmuxd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
cap-std = "3"
russh = "0.64.1"
rand = "0.10"
sha2 = "0.10"
base64 = "0.23.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
