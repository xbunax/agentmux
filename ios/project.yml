name: AgentMux
options:
  bundleIdPrefix: dev.agentmux
  deploymentTarget:
    iOS: '17.0'
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
targets:
  AgentMux:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Citadel
      - package: swift-nio
        product: NIO
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentmux.app
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentMux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Connect to your Mac AgentMux service through your private network.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        MARKETING_VERSION: '0.4.0'
        CURRENT_PROJECT_VERSION: '4'
